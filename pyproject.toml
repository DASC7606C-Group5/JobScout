[project]
name = "jobscout"
version = "0.1.0"
description = "Personalized job discovery and recommendation workflow"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiolimiter>=1.2,<2",
    "argon2-cffi>=25,<26",
    "async-lru>=2,<3",
    "cachetools>=7,<8",
    "cryptography>=50.0.2,<51",
    "fastapi>=0.142.3,<1",
    "httpx>=0.28,<1",
    "langchain-deepseek>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic-settings>=2.7,<3",
    "pypdf>=6.19,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.22,<1",
    "selectolax>=1.0,<2",
    "tenacity>=9,<10",
    "tortoise-orm>=0.25,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pre-commit>=4,<5",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<5",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
extend-exclude = [".uv-cache", ".uv-python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".tools/pytest-cache"
strict = true
addopts = [
    "--basetemp=./pytest-tmp",
    "-n",
    "4",
    "--dist=loadscope",
]
